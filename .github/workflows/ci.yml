name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Validate
        run: make validate

      - name: Run govulncheck
        run: make vulncheck

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          path: |
            test-report.xml
            coverage.out
          if-no-files-found: warn

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and smoke test the container
        shell: bash
        run: |
          set -euo pipefail
          image="thousandeyes-cli:smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="thousandeyes-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_dir="$(mktemp -d)"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT

          python3 - "$smoke_dir" <<'PY'
          import json
          import os
          import pathlib
          import sys

          directory = pathlib.Path(sys.argv[1])
          suite = json.loads(pathlib.Path("examples/synthetics/thousandeyes-ci.json").read_text())
          for test in suite["tests"]:
              test["executionRule"] = "skipped"
          fixture = directory / "thousandeyes-ci.json"
          fixture.write_text(json.dumps(suite))
          os.chmod(directory, 0o755)
          os.chmod(fixture, 0o644)
          PY

          docker build --tag "$image" .
          docker run --rm --name "$container" \
            --network none --read-only --user 65532:65532 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env TE_TOKEN=container-smoke-fake-token \
            --volume "$smoke_dir:/config:ro" \
            "$image" synthetics run-tests \
            --config /config/thousandeyes-ci.json --timeout 5s --json \
            > "$smoke_dir/report.json"

          python3 - "$smoke_dir/report.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = [
              ("canary-http", "http-server", "https://canary.example.com/health"),
              ("canary-network", "agent-to-server", "canary.example.com:443"),
          ]
          assert report["version"] == 1, report
          assert report["runId"], report
          assert len(report["tests"]) == len(expected), report
          for result, (name, kind, target) in zip(report["tests"], expected):
              actual = (result["name"], result["type"], result["target"], result["status"], result["executionRule"])
              assert actual == (name, kind, target, "skipped", "skipped"), result
              assert result["agents"] == [], result
          assert "container-smoke-fake-token" not in json.dumps(report), report
          PY

  goreleaser:
    name: GoReleaser Snapshot
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-dist
          path: dist/
          if-no-files-found: warn
